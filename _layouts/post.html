<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>{{ page.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      type="text/css"
      media="screen"
      href="/assets/main.css"
    />
    <link rel="stylesheet" href="/assets/posts.css" />
    <script src="/assets/script.js" defer></script>
    <script
      type="text/javascript"
      id="MathJax-script"
      async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"
    ></script>
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-DEHWKXZD9R"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-DEHWKXZD9R");
    </script>
  </head>
  <body class="posts-page post-page">
    <main class="math-content post-content" id="main">
      <nav class="post-navigation" aria-label="Main navigation">
        <a href="/">Home</a><a href="/projects.html">Projects</a><a href="/posts.html">Math posts</a>
      </nav>
      <article>
        <header class="post-header">
          <div class="post-preview-meta">
            {% if page.topic %}<span>{{ page.topic }}</span>{% endif %}
            <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%d %B %Y" }}</time>
          </div>
          <h1>{{ page.title }}</h1>
        </header>
        <div class="post-body">{{ content }}</div>
      </article>
      <footer class="post-footer"><a href="/posts.html">← All math posts</a><a href="#main">Back to top ↑</a></footer>
    </main>
  </body>
</html>
