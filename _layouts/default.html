<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Hiten Dalmia / {{ page.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      type="text/css"
      media="screen"
      href="/assets/main.css"
    />
    {% if page.stylesheet %}
    <link rel="stylesheet" href="{{ page.stylesheet | relative_url }}" />
    {% endif %}
    <script src="/assets/script.js" defer></script>
    {% unless page.math == false %}
    <script
      type="text/javascript"
      id="MathJax-script"
      async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"
    ></script>
    {% endunless %}
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-DEHWKXZD9R"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-DEHWKXZD9R");
    </script>
  </head>
  <body{% if page.body_class %} class="{{ page.body_class }}"{% endif %}>
    <!-- sidebar -->
    {% unless page.hide_sidebar %}{% include sidebar.html %}{% endunless %}

    <!-- content -->
    {{ content }}
  </body>
</html>
