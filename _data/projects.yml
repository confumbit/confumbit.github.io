# Subjective map coordinates, each on a 0–10 scale.
# Complexity: engineering scope; interestingness: estimated personal enjoyment.
# Enjoyment scores are provisional: playful experiments and exploration rank highly.
- name: Medicare Order Procurement Portal
  complexity: 8.5
  interestingness: 6
  url: https://www.medicaregalaxy.in/
  display_url: medicaregalaxy.in
  company:
    name: Medicare Galaxy LLP
    logo: /assets/medicare-galaxy-logo.jpg
  image_path: /assets/p11.png
  description:
    - "Built a <strong>multi-source order ingestion</strong> and procurement platform, with <strong>ETL pipelines</strong> that consolidate retail orders, wholesale client orders, and unstructured WhatsApp medicine requests into a unified stream of standardized order records."
    - "Applied <strong>NLP</strong> to process incoming WhatsApp messages, extract medicine requests, and convert them into structured orders linked to the corresponding medicines in the product catalogue."
    - "Developed the data-processing backend using <strong>Node.js and Express</strong>, with <strong>PostgreSQL</strong> storing normalized order data and relationships between orders, medicines, and customers."
    - "Created separate retail and business-client portals with distinct product listings and ordering requirements, including <strong>fuzzy search</strong> across approximately <strong>20,000 catalogue items</strong>. Both feed the same downstream order-processing pipeline."
    - "Built an <strong>order-management ERP</strong> on top of the consolidated data, supporting order tracking, <strong>role-based user privileges</strong>, employee assignment, internal notes, per-order change logs, and recurring orders that automatically reschedule."

- name: LOKA — Cross-platform AR App
  complexity: 9.5
  interestingness: 9
  url: https://discoverloka.org/
  display_url: discoverloka.org
  company:
    name: Tagglabs Experimental Pvt. Ltd.
    logo: /assets/tagglabs-logo.jpg
    url: https://www.tagglabs.in/
  related_links:
    - name: flutter_featurematching on pub.dev
      url: https://pub.dev/packages/flutter_featurematching
  image_path: /assets/loka-local-find.png
  image_alt: "LOKA tag detail screen showing a local fruit vendor and community-added tags."
  additional_images:
    - path: /assets/loka-map.png
      alt: "LOKA map screen showing nearby geo-tagged places."
  description:
    - "<strong>Led alpha development</strong> of LOKA, a location-aware augmented reality platform, focusing on <strong>computer vision</strong>, native-library integration, and backend web services."
    - "Integrated <strong>SIFT-based image feature matching</strong> with <strong>OpenCV</strong> through <strong>native C APIs</strong>, connecting the <strong>computer vision</strong> implementation to the application."
    - "Developed <strong>flutter_featurematching</strong>, a <strong>Dart/Flutter computer vision package</strong> that exposes native feature-matching functionality through a Dart interface."
    - "Developed the application's <strong>Django backend</strong> and <strong>RESTful API</strong>."


- name: KMC Logo on the Complex Plane
  complexity: 4.5
  interestingness: 9.3
  url: /2025/05/28/kmc-logo.html
  display_url: Read the mathematical write-up
  image_path: /assets/graph-logo.png
  image_alt: "Kirori Mal College's logo reconstructed on the complex plane using Fourier series."
  description:
    - "Reconstructed the Kirori Mal College logo on the complex plane using <strong>complex-valued Fourier series</strong>, turning its outlines into sums of rotating exponentials."
    - "Used <strong>201 terms per series</strong> for sharper figures; the accompanying post lists the ten most heavily weighted terms, alongside equations for the simpler geometric elements."
    - "Created with Prasoon Patel during our undergraduate studies in mathematics at Kirori Mal College, University of Delhi."

