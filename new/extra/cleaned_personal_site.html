<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0b0a" />
    <title>Your Name — Personal Site</title>
    <style>
      :root {
        color-scheme: light dark;
        --page-bg: light-dark(#a6a6a2, #0b0b0a);
        --page-ink: light-dark(#171714, #efeee8);
        --page-muted: light-dark(#77766f, #a4a29a);
        --page-rule: light-dark(
          rgba(23, 23, 20, 0.22),
          rgba(239, 238, 232, 0.24)
        );
        --focus: light-dark(#171714, #efeee8);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--page-bg);
      }

      body {
        color: var(--page-ink);
        font-family: Arial, Helvetica, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
      }

      .app-root {
        position: fixed;
        inset: 0;
        overflow: hidden;
        border-radius: 0;
        background-color: var(--page-bg);
        isolation: isolate;
      }

      .stage {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: var(--page-bg);
      }

      .scene {
        position: relative;
        flex: none;
        overflow: visible;
        background: var(--page-bg);
      }

      .scene[data-format="landscape"] {
        width: min(100vw, 200svh);
        aspect-ratio: 2 / 1;
      }

      .scene[data-format="square"] {
        width: min(100vw, 100svh);
        aspect-ratio: 1 / 1;
      }

      .scene[data-format="portrait"] {
        width: min(100vw, 50svh);
        aspect-ratio: 1 / 2;
      }

      #signal-canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        background: var(--page-bg);
        filter: blur(5px);
        transition: filter 180ms ease-out;
      }

      .interaction-layer {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }

      .nav-link {
        position: absolute;
        display: block;
        overflow: visible;
        color: transparent;
        -webkit-text-fill-color: transparent;
        text-decoration: none;
        white-space: nowrap;
        pointer-events: auto;
        outline: none;
        -webkit-tap-highlight-color: transparent;
      }

      .nav-link::after {
        position: absolute;
        right: 0;
        bottom: -0.12em;
        left: 0;
        height: 1px;
        background: var(--page-ink);
        content: "";
        opacity: 0;
        transform: scaleX(0.6);
        transform-origin: left center;
        transition:
          opacity 120ms ease-out,
          transform 120ms ease-out;
      }

      .nav-link:hover::after,
      .nav-link:focus-visible::after {
        opacity: 1;
        transform: scaleX(1);
      }

      .nav-link:focus-visible {
        border-radius: 1px;
        outline: 1px solid var(--focus);
        outline-offset: 5px;
      }

      .bandwidth-label,
      .bandwidth-output {
        position: absolute;
        z-index: 3;
        color: var(--page-ink);
        font-family: "Courier New", Courier, monospace;
        font-weight: 400;
        white-space: nowrap;
        pointer-events: none;
        font-variant-numeric: tabular-nums;
      }

      .bandwidth-label {
        left: var(--label-x, 7.4%);
        top: var(--label-y, 84%);
        color: var(--page-muted);
        letter-spacing: 0.12em;
        transform: translateY(-100%);
      }

      .bandwidth-output {
        right: var(--output-right, 7.4%);
        top: var(--output-y, 90%);
        transform: translateY(-50%);
        text-align: right;
      }

      #bandwidth {
        position: absolute;
        z-index: 4;
        display: block;
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        accent-color: var(--page-ink);
        cursor: ew-resize;
        touch-action: pan-y;
        -webkit-appearance: none;
        appearance: none;
      }

      #bandwidth:focus-visible {
        outline: 1px solid var(--focus);
        outline-offset: 7px;
      }

      #bandwidth::-webkit-slider-runnable-track {
        height: 1px;
        border: 0;
        background: var(--page-muted);
      }

      #bandwidth::-moz-range-track {
        height: 1px;
        border: 0;
        background: var(--page-muted);
      }

      #bandwidth::-webkit-slider-thumb {
        width: 8px;
        height: 8px;
        margin-top: -3.5px;
        border: 0;
        border-radius: 50%;
        background: var(--page-ink);
        -webkit-appearance: none;
        appearance: none;
      }

      #bandwidth::-moz-range-thumb {
        width: 8px;
        height: 8px;
        border: 0;
        border-radius: 50%;
        background: var(--page-ink);
      }

      .sr-only {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        padding: 0 !important;
        margin: -1px !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important;
        white-space: nowrap !important;
        border: 0 !important;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-root" id="home">
      <div class="sr-only">
        <h1>Your Name</h1>
        <p>Mathematics, software, and the spaces between.</p>
      </div>

      <section class="stage" aria-label="Personal homepage signal display">
        <div class="scene" id="scene" data-format="landscape">
          <canvas id="signal-canvas" aria-hidden="true"></canvas>
          <nav
            class="interaction-layer"
            id="navigation"
            aria-label="Primary navigation"
          ></nav>
          <label class="sr-only" for="bandwidth"
            >Signal bandwidth. Increase to restore detail.</label
          >
          <span class="bandwidth-label" id="bandwidth-label" aria-hidden="true"
            >BANDWIDTH</span
          >
          <input
            id="bandwidth"
            type="range"
            min="0"
            max="100"
            step="1"
            value="18"
            aria-describedby="bandwidth-help"
          />
          <output
            class="bandwidth-output"
            id="bandwidth-output"
            for="bandwidth"
            aria-live="polite"
            >18% · LIMITED SIGNAL</output
          >
          <span class="sr-only" id="bandwidth-help"
            >At lower bandwidth, fewer image frequencies are retained. Increase
            bandwidth to restore image detail.</span
          >
        </div>
      </section>
    </main>

    <script>
      (() => {
        "use strict";

        const scene = document.getElementById("scene");
        const canvas = document.getElementById("signal-canvas");
        const canvasContext = canvas.getContext("2d", { alpha: false });
        const navigation = document.getElementById("navigation");
        const slider = document.getElementById("bandwidth");
        const sliderOutput = document.getElementById("bandwidth-output");
        const sliderLabel = document.getElementById("bandwidth-label");
        const colorScheme = window.matchMedia("(prefers-color-scheme: dark)");

        const NAV_ITEMS = [
          { label: "Home", href: "#home" },
          { label: "Math Posts", href: "/math-posts" },
          { label: "Software Projects", href: "/software-projects" },
          { label: "Curriculum Vitae", href: "/curriculum-vitae.pdf" },
          { label: "Resume", href: "/resume.pdf" },
        ];

        let worker = null;
        let workerReady = false;
        let workerBusy = false;
        let lastSentValue = -1;
        let format = null;
        let workerUrl = null;
        let resizeTimer = 0;
        let sceneScale = 1;

        const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

        function currentPalette() {
          const styles = getComputedStyle(document.documentElement);
          return {
            background: styles.getPropertyValue("--page-bg").trim(),
            ink: styles.getPropertyValue("--page-ink").trim(),
            muted: styles.getPropertyValue("--page-muted").trim(),
            rule: styles.getPropertyValue("--page-rule").trim(),
          };
        }

        function chooseFormat() {
          const ratio = window.innerWidth / Math.max(1, window.innerHeight);
          if (ratio > 1.45)
            return { name: "landscape", width: 512, height: 256 };
          if (ratio < 0.8) return { name: "portrait", width: 256, height: 512 };
          return { name: "square", width: 512, height: 512 };
        }

        function drawTrackedText(ctx, text, x, y, tracking, align) {
          let width = 0;
          for (let i = 0; i < text.length; i += 1) {
            width += ctx.measureText(text[i]).width;
            if (i < text.length - 1) width += tracking;
          }
          let startX = x;
          if (align === "right") startX -= width;
          if (align === "center") startX -= width / 2;
          for (let i = 0; i < text.length; i += 1) {
            ctx.fillText(text[i], startX, y);
            startX += ctx.measureText(text[i]).width + tracking;
          }
          return width;
        }

        function drawRule(ctx, palette, x1, y, x2) {
          ctx.save();
          ctx.strokeStyle = palette.rule;
          ctx.lineWidth = 0.7;
          ctx.beginPath();
          ctx.moveTo(x1, Math.round(y) + 0.5);
          ctx.lineTo(x2, Math.round(y) + 0.5);
          ctx.stroke();
          ctx.restore();
        }

        function addNavLink(item, box, fontSize, family) {
          const anchor = document.createElement("a");
          anchor.className = "nav-link";
          anchor.href = item.href;
          anchor.textContent = item.label;
          anchor.setAttribute("aria-label", item.label);
          anchor.style.left = `${(box.x / format.width) * 100}%`;
          anchor.style.top = `${(box.top / format.height) * 100}%`;
          anchor.style.width = `${(box.width / format.width) * 100}%`;
          anchor.style.height = `${(box.height / format.height) * 100}%`;
          anchor.style.fontFamily = family;
          anchor.style.fontSize = `${fontSize * sceneScale}px`;
          anchor.style.lineHeight = `${box.height * sceneScale}px`;
          navigation.appendChild(anchor);
        }

        function drawNoise(ctx, width, height, background) {
          // Stable luminance grain. The light background gets stronger TV-like static;
          // the dark background retains its original, subtler texture.
          const data = ctx.createImageData(width, height);
          const rgb = background.match(/\d+(?:\.\d+)?/g);
          const hex = background.match(/[\da-f]{2}/gi);
          const base =
            background.startsWith("rgb") && rgb
              ? Number(rgb[0])
              : hex
                ? parseInt(hex[0], 16)
                : 11;
          const strongerGrain = base > 100;
          let seed = 1729;
          for (let i = 0; i < width * height; i += 1) {
            seed = (seed * 1664525 + 1013904223) >>> 0;
            const grain = strongerGrain
              ? ((seed >>> 24) & 31) - 15
              : ((seed >>> 28) & 15) - 7;
            const value = clamp(
              base + grain * (strongerGrain ? 1.1 : 0.42),
              0,
              255,
            );
            const offset = i * 4;
            data.data[offset] = value;
            data.data[offset + 1] = value;
            data.data[offset + 2] = value;
            data.data[offset + 3] = 255;
          }
          ctx.putImageData(data, 0, 0);
        }

        // Keep format-specific geometry in one place so visual adjustments are easy to make.
        const LAYOUT_DESIGNS = {
          landscape: {
            headerX: 38,
            headerY: 31,
            headerFontSize: 8,
            headerLeft: "PERSONAL SITE / 001",
            headerRight: "INDEPENDENT TRANSMISSION",
            headerLeftTracking: 0.9,
            headerRightTracking: 0.55,
            titleY: 87,
            titleSize: 34,
            introSize: 9.6,
            introLines: [{ text: "Mathematics, software, and the spaces between.", y: 116 }],
            ruleY1: 148,
            nav: { mode: "horizontal", size: 9.4, baselines: [175], gap: 16 },
            ruleY2: 198,
            bandwidthLabel: { baseline: 220, fontSize: 7.7, tracking: 0.7 },
            slider: { y: 231, width: 210 },
            outputRight: 38,
          },
          portrait: {
            headerX: 26,
            headerY: 38,
            headerFontSize: 7.2,
            headerLeft: "PERSONAL SITE / 001",
            headerRight: "SIGNAL / 01",
            headerLeftTracking: 0.45,
            headerRightTracking: 0.45,
            titleY: 121,
            titleSize: 29,
            introSize: 10.5,
            introLines: [
              { text: "Mathematics, software,", y: 149 },
              { text: "and the spaces between.", y: 166 },
            ],
            ruleY1: 197,
            nav: { mode: "vertical", size: 11.5, baselines: [233, 270, 307, 344, 381], indexRight: 27 },
            ruleY2: 408,
            bandwidthLabel: { baseline: 436, fontSize: 7.7, tracking: 0.55 },
            slider: { y: 456, width: 105 },
            outputRight: 26,
          },
          square: {
            headerX: 42,
            headerY: 45,
            headerFontSize: 8,
            headerLeft: "PERSONAL SITE / 001",
            headerRight: "INDEPENDENT TRANSMISSION",
            headerLeftTracking: 0.9,
            headerRightTracking: 0.55,
            titleY: 149,
            titleSize: 48,
            introSize: 13,
            introLines: [
              { text: "Mathematics, software,", y: 180 },
              { text: "and the spaces between.", y: 199 },
            ],
            ruleY1: 230,
            nav: { mode: "vertical", size: 12.8, baselines: [269, 305, 341, 377, 413], indexRight: 43 },
            ruleY2: 440,
            bandwidthLabel: { baseline: 469, fontSize: 8, tracking: 0.65 },
            slider: { y: 490, width: 235 },
            outputRight: 42,
          },
        };

        function paintSource(ctx, layout, palette) {
          const { width: w, height: h, name } = layout;
          const design = LAYOUT_DESIGNS[name];
          const sans = "Arial, Helvetica, sans-serif";
          const mono = '"Courier New", Courier, monospace';
          const serif = 'Georgia, "Times New Roman", serif';
          const navBoxes = [];

          drawNoise(ctx, w, h, palette.background);
          ctx.textBaseline = "alphabetic";

          // Shared header and introduction.
          ctx.fillStyle = palette.muted;
          ctx.font = `${design.headerFontSize}px ${mono}`;
          drawTrackedText(
            ctx,
            design.headerLeft,
            design.headerX,
            design.headerY,
            design.headerLeftTracking,
            "left",
          );
          drawTrackedText(
            ctx,
            design.headerRight,
            w - design.headerX,
            design.headerY,
            design.headerRightTracking,
            "right",
          );

          ctx.fillStyle = palette.ink;
          ctx.font = `${design.titleSize}px ${serif}`;
          ctx.fillText("Your Name", design.headerX, design.titleY);

          ctx.font = `${design.introSize}px ${sans}`;
          ctx.fillStyle = palette.muted;
          for (const line of design.introLines) {
            ctx.fillText(line.text, design.headerX + 1, line.y);
          }

          drawRule(ctx, palette, design.headerX, design.ruleY1, w - design.headerX);

          // Shared navigation renderer, with horizontal or vertical placement per format.
          ctx.font = `${design.nav.size}px ${sans}`;
          ctx.fillStyle = palette.ink;
          if (design.nav.mode === "horizontal") {
            let navX = design.headerX;
            const baseline = design.nav.baselines[0];
            for (const item of NAV_ITEMS) {
              const textWidth = ctx.measureText(item.label).width;
              ctx.fillText(item.label, navX, baseline);
              navBoxes.push({
                item,
                x: navX - 2,
                top: baseline - design.nav.size * 1.08,
                width: textWidth + 5,
                height: design.nav.size * 1.5,
              });
              navX += textWidth + design.nav.gap;
            }
          } else {
            for (let i = 0; i < NAV_ITEMS.length; i += 1) {
              const item = NAV_ITEMS[i];
              const baseline = design.nav.baselines[i];
              const textWidth = ctx.measureText(item.label).width;
              ctx.fillText(item.label, design.headerX, baseline);

              ctx.font = `8px ${mono}`;
              ctx.fillStyle = palette.muted;
              ctx.fillText(
                String(i + 1).padStart(2, "0"),
                w - design.nav.indexRight,
                baseline,
              );
              ctx.font = `${design.nav.size}px ${sans}`;
              ctx.fillStyle = palette.ink;

              navBoxes.push({
                item,
                x: design.headerX - 2,
                top: baseline - design.nav.size * 1.12,
                width: Math.min(w - design.headerX * 2, textWidth + 25),
                height: design.nav.size * 1.55,
              });
            }
          }

          drawRule(ctx, palette, design.headerX, design.ruleY2, w - design.headerX);

          ctx.font = `${design.bandwidthLabel.fontSize}px ${mono}`;
          ctx.fillStyle = palette.muted;
          drawTrackedText(
            ctx,
            "BANDWIDTH",
            design.headerX,
            design.bandwidthLabel.baseline,
            design.bandwidthLabel.tracking,
            "left",
          );

          const bandwidth = {
            x: design.headerX,
            y: design.slider.y,
            width: design.slider.width,
          };

          // Fine track and endpoint ticks match the accessible range input layered above it.
          ctx.save();
          ctx.strokeStyle = palette.rule;
          ctx.lineWidth = 0.65;
          ctx.beginPath();
          ctx.moveTo(bandwidth.x, bandwidth.y + 0.5);
          ctx.lineTo(bandwidth.x + bandwidth.width, bandwidth.y + 0.5);
          ctx.stroke();
          ctx.restore();

          ctx.save();
          ctx.strokeStyle = palette.muted;
          ctx.lineWidth = 0.7;
          for (const x of [bandwidth.x, bandwidth.x + bandwidth.width]) {
            ctx.beginPath();
            ctx.moveTo(x + 0.5, bandwidth.y - 3);
            ctx.lineTo(x + 0.5, bandwidth.y + 3);
            ctx.stroke();
          }
          ctx.restore();

          return { navBoxes, bandwidth, labelBaseline: design.bandwidthLabel.baseline };
        }

        function placeControls(layout, positions) {
          navigation.replaceChildren();
          const sans = "Arial, Helvetica, sans-serif";
          const design = LAYOUT_DESIGNS[layout.name];
          positions.navBoxes.forEach(({ item, ...box }) =>
            addNavLink(item, box, design.nav.size, sans),
          );

          const { bandwidth } = positions;
          slider.style.left = `${(bandwidth.x / layout.width) * 100}%`;
          slider.style.top = `${(bandwidth.y / layout.height) * 100}%`;
          slider.style.width = `${(bandwidth.width / layout.width) * 100}%`;
          slider.style.height = `${Math.max(28, sceneScale * 12)}px`;
          slider.style.transform = "translateY(-50%)";

          const labelSize = design.bandwidthLabel.fontSize;
          sliderLabel.style.left = `${(bandwidth.x / layout.width) * 100}%`;
          sliderLabel.style.top = `${(positions.labelBaseline / layout.height) * 100}%`;
          sliderLabel.style.fontSize = `${Math.max(9, labelSize * sceneScale)}px`;

          sliderOutput.style.right = `${(design.outputRight / layout.width) * 100}%`;
          sliderOutput.style.top = `${(bandwidth.y / layout.height) * 100}%`;
          sliderOutput.style.fontSize = `${Math.max(9, labelSize * sceneScale)}px`;
        }

        const workerSource = `
        "use strict";
        let width = 0;
        let height = 0;
        let spectrumReal = null;
        let spectrumImag = null;

        function fft1d(real, imag, inverse) {
          const n = real.length;
          let j = 0;
          for (let i = 1; i < n; i += 1) {
            let bit = n >> 1;
            while (j & bit) { j ^= bit; bit >>= 1; }
            j ^= bit;
            if (i < j) {
              let tmp = real[i]; real[i] = real[j]; real[j] = tmp;
              tmp = imag[i]; imag[i] = imag[j]; imag[j] = tmp;
            }
          }
          for (let size = 2; size <= n; size <<= 1) {
            const angle = (inverse ? 2 : -2) * Math.PI / size;
            const stepReal = Math.cos(angle);
            const stepImag = Math.sin(angle);
            const half = size >> 1;
            for (let start = 0; start < n; start += size) {
              let twiddleReal = 1;
              let twiddleImag = 0;
              for (let k = 0; k < half; k += 1) {
                const even = start + k;
                const odd = even + half;
                const oddReal = real[odd] * twiddleReal - imag[odd] * twiddleImag;
                const oddImag = real[odd] * twiddleImag + imag[odd] * twiddleReal;
                const evenReal = real[even];
                const evenImag = imag[even];
                real[even] = evenReal + oddReal;
                imag[even] = evenImag + oddImag;
                real[odd] = evenReal - oddReal;
                imag[odd] = evenImag - oddImag;
                const nextReal = twiddleReal * stepReal - twiddleImag * stepImag;
                twiddleImag = twiddleReal * stepImag + twiddleImag * stepReal;
                twiddleReal = nextReal;
              }
            }
          }
          if (inverse) {
            for (let i = 0; i < n; i += 1) { real[i] /= n; imag[i] /= n; }
          }
        }

        function fft2d(real, imag, w, h, inverse) {
          const rowReal = new Float64Array(w);
          const rowImag = new Float64Array(w);
          for (let y = 0; y < h; y += 1) {
            const start = y * w;
            rowReal.set(real.subarray(start, start + w));
            rowImag.set(imag.subarray(start, start + w));
            fft1d(rowReal, rowImag, inverse);
            real.set(rowReal, start);
            imag.set(rowImag, start);
          }
          const colReal = new Float64Array(h);
          const colImag = new Float64Array(h);
          for (let x = 0; x < w; x += 1) {
            for (let y = 0; y < h; y += 1) {
              const index = y * w + x;
              colReal[y] = real[index];
              colImag[y] = imag[index];
            }
            fft1d(colReal, colImag, inverse);
            for (let y = 0; y < h; y += 1) {
              const index = y * w + x;
              real[index] = colReal[y];
              imag[index] = colImag[y];
            }
          }
        }

        self.onmessage = function(event) {
          const message = event.data;
          if (message.type === "init") {
            width = message.width;
            height = message.height;
            const pixels = new Uint8ClampedArray(message.pixels);
            spectrumReal = new Float64Array(width * height);
            spectrumImag = new Float64Array(width * height);
            for (let i = 0; i < spectrumReal.length; i += 1) spectrumReal[i] = pixels[i * 4];
            fft2d(spectrumReal, spectrumImag, width, height, false);
            self.postMessage({ type: "ready" });
            return;
          }

          if (message.type !== "render" || !spectrumReal) return;
          const amount = Math.max(0, Math.min(1, message.bandwidth / 100));
          // Preserve more vertical-frequency detail to create horizontal signal bands.
          const verticalCompression = 0.34;
          const maxRadius = Math.hypot(width / 2, (height / 2) * verticalCompression);
          const cutoff = 0.65 + (maxRadius - 0.65) * Math.pow(amount, 1.08);
          const transition = Math.max(1.25, cutoff * 0.065);
          const lowEdge = Math.max(0, cutoff - transition / 2);
          const highEdge = cutoff + transition / 2;
          const real = new Float64Array(spectrumReal);
          const imag = new Float64Array(spectrumImag);

          for (let y = 0; y < height; y += 1) {
            const fy = y <= height / 2 ? y : y - height;
            const rowStart = y * width;
            for (let x = 0; x < width; x += 1) {
              const fx = x <= width / 2 ? x : x - width;
              const distance = Math.hypot(fx, fy * verticalCompression);
              let weight;
              if (amount >= 1 || distance <= lowEdge) {
                weight = 1;
              } else if (distance >= highEdge) {
                weight = 0;
              } else {
                const t = (distance - lowEdge) / (highEdge - lowEdge);
                weight = 1 - t * t * (3 - 2 * t);
              }
              const index = rowStart + x;
              real[index] *= weight;
              imag[index] *= weight;
            }
          }

          fft2d(real, imag, width, height, true);
          const output = new Uint8ClampedArray(width * height * 4);
          for (let i = 0; i < width * height; i += 1) {
            const value = Math.max(0, Math.min(255, Math.round(real[i])));
            const offset = i * 4;
            output[offset] = value;
            output[offset + 1] = value;
            output[offset + 2] = value;
            output[offset + 3] = 255;
          }
          self.postMessage({ type: "frame", bandwidth: message.bandwidth, pixels: output.buffer }, [output.buffer]);
        };
      `;

        function updateOutput() {
          const value = Number(slider.value);
          let state = "LIMITED SIGNAL";
          if (value >= 72) state = "FULL SIGNAL";
          else if (value >= 36) state = "PARTIAL SIGNAL";
          sliderOutput.textContent = `${String(value).padStart(2, "0")}% · ${state}`;
        }

        function stopWorker() {
          if (worker) worker.terminate();
          if (workerUrl) URL.revokeObjectURL(workerUrl);
          workerUrl = null;
          worker = null;
          workerReady = false;
          workerBusy = false;
          lastSentValue = -1;
        }

        function requestLatestFrame() {
          if (!worker || !workerReady || workerBusy) return;
          const value = Number(slider.value);
          if (value === lastSentValue) return;
          workerBusy = true;
          lastSentValue = value;
          worker.postMessage({ type: "render", bandwidth: value });
        }

        function startWorker(pixels, layout) {
          stopWorker();
          try {
            const blob = new Blob([workerSource], { type: "text/javascript" });
            workerUrl = URL.createObjectURL(blob);
            worker = new Worker(workerUrl);
            worker.onmessage = (event) => {
              const message = event.data;
              if (message.type === "ready") {
                if (workerUrl) URL.revokeObjectURL(workerUrl);
                workerUrl = null;
                workerReady = true;
                requestLatestFrame();
                return;
              }
              if (message.type === "frame") {
                const outputPixels = new Uint8ClampedArray(message.pixels);
                const image = new ImageData(
                  outputPixels,
                  layout.width,
                  layout.height,
                );
                canvasContext.putImageData(image, 0, 0);
                canvas.style.filter = "none";
                workerBusy = false;
                if (Number(slider.value) !== message.bandwidth)
                  requestLatestFrame();
              }
            };
            worker.onerror = () => {
              stopWorker();
              // If workers are blocked by the host preview, retain a usable page with a CSS-only fallback.
              canvas.style.filter = `blur(${Math.max(0, (100 - Number(slider.value)) / 13)}px)`;
            };
            const transferablePixels = new Uint8ClampedArray(pixels);
            worker.postMessage(
              {
                type: "init",
                width: layout.width,
                height: layout.height,
                pixels: transferablePixels.buffer,
              },
              [transferablePixels.buffer],
            );
          } catch (error) {
            stopWorker();
            canvas.style.filter = `blur(${Math.max(0, (100 - Number(slider.value)) / 13)}px)`;
          }
        }

        function rebuild() {
          stopWorker();
          format = chooseFormat();
          scene.dataset.format = format.name;
          sceneScale = scene.clientWidth / format.width || 1;
          canvas.width = format.width;
          canvas.height = format.height;
          canvas.style.filter = "blur(5px)";

          const sourceCanvas = document.createElement("canvas");
          sourceCanvas.width = format.width;
          sourceCanvas.height = format.height;
          const sourceContext = sourceCanvas.getContext("2d", {
            alpha: false,
            willReadFrequently: true,
          });
          const palette = currentPalette();
          const positions = paintSource(sourceContext, format, palette);
          const pixels = sourceContext.getImageData(
            0,
            0,
            format.width,
            format.height,
          ).data;
          canvasContext.drawImage(sourceCanvas, 0, 0);

          placeControls(format, positions);
          updateOutput();
          startWorker(pixels, format);
        }

        slider.addEventListener(
          "input",
          () => {
            updateOutput();
            requestLatestFrame();
            if (!worker)
              canvas.style.filter = `blur(${Math.max(0, (100 - Number(slider.value)) / 13)}px)`;
          },
          { passive: true },
        );

        window.addEventListener(
          "resize",
          () => {
            window.clearTimeout(resizeTimer);
            resizeTimer = window.setTimeout(rebuild, 120);
          },
          { passive: true },
        );

        colorScheme.addEventListener?.("change", () => {
          window.clearTimeout(resizeTimer);
          resizeTimer = window.setTimeout(rebuild, 80);
        });

        rebuild();
      })();
    </script>
  </body>
</html>
